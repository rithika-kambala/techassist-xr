<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TechAssist XR — WS Test Client v2</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px;
         background: #111827; color: #e5e7eb; }
  fieldset { margin-bottom: 16px; border: 1px solid #374151; border-radius: 8px; }
  legend { padding: 0 6px; color: #9ca3af; }
  label { display: inline-block; width: 110px; }
  input, select, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #4b5563; }
  input, select { background: #0b1020; color: #e5e7eb; }
  button { background: #2563eb; color: white; cursor: pointer; margin-right: 6px; }
  button.secondary { background: #4b5563; }
  #state { font-weight: bold; padding: 4px 10px; border-radius: 4px; display: inline-block; }
  .CONNECTING, .RECONNECTING { background: #78350f; }
  .CONNECTED { background: #14532d; }
  .DISCONNECTED { background: #7f1d1d; }
  .step-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-top: 10px; }
  .step-card { border: 1px solid #4b5563; border-radius: 6px; padding: 8px; font-size: 13px; }
  .step-card.current { border-color: #60a5fa; }
  .step-card.done { border-color: #34d399; }
  .step-card span { display: block; color: #9ca3af; margin-top: 4px; }
  #log { background: #0b1020; color: #86efac; font-family: ui-monospace, monospace; font-size: 12px;
         height: 300px; overflow-y: auto; padding: 8px; white-space: pre-wrap; border-radius: 6px; }
  .pending { color: #fbbf24; font-weight: bold; }
</style>
</head>
<body>
  <h2>TechAssist XR — Real-Time Event Test Client (v2)</h2>

  <fieldset>
    <legend>Project contract</legend>
    <div id="contractInfo">Waiting for server…</div>
    <div class="step-list" id="stepList"></div>
  </fieldset>

  <fieldset>
    <legend>Connection</legend>
    <label>Server URL</label><input id="url" value="ws://localhost:8080" size="26"><br><br>
    <label>Session ID</label><input id="sessionId" value="A102-local-demo"><br><br>
    <label>Role</label>
    <select id="role">
      <option value="technician">technician</option>
      <option value="expert" selected>expert</option>
    </select><br><br>
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" class="secondary">Disconnect</button>
    <span id="state" class="DISCONNECTED">DISCONNECTED</span>
    &nbsp; Unacked: <span id="pendingCount" class="pending">0</span>
  </fieldset>

  <fieldset>
    <legend>Send event (uses the selected step below)</legend>
    <label>Step</label><select id="stepSelect"></select><br><br>
    <button data-type="STEP_STARTED">Send STEP_STARTED</button>
    <button data-type="STEP_COMPLETED">Send STEP_COMPLETED</button>
    <button data-type="ANNOTATION_CREATED">Send ANNOTATION_CREATED</button>
    <button data-type="SESSION_ENDED">Send SESSION_ENDED</button>
  </fieldset>

  <fieldset>
    <legend>Log</legend>
    <div id="log"></div>
  </fieldset>

<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log');
let ws = null;
let reconnectAttempts = 0;
let manualDisconnect = false;
let reconnectTimer = null;
let contract = null;

// eventId -> the exact message we sent, so we can resend it verbatim after a reconnect.
const pending = new Map();
// eventIds we've already applied to local UI state — guards against the
// SNAPSHOT replay re-processing something we already saw live.
const seenEventIds = new Set();

function logLine(text) {
  const ts = new Date().toLocaleTimeString();
  logEl.textContent += `[${ts}] ${text}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function setState(state) {
  const el = $('state');
  el.textContent = state;
  el.className = state;
}

function updatePendingCount() {
  $('pendingCount').textContent = String(pending.size);
}

function renderContract() {
  if (!contract) return;
  $('contractInfo').textContent =
    `${contract.machine.display_name} (${contract.machine.machine_id}) — ${contract.procedure.title}`;
  $('stepSelect').innerHTML = contract.procedure.steps.map(
    (s) => `<option value="${s.step_number}">Step ${s.step_number}: ${s.title}</option>`
  ).join('');
  renderStepList();
}

const stepStatus = new Map(); // step_number -> 'current' | 'done'

function renderStepList() {
  if (!contract) return;
  $('stepList').innerHTML = contract.procedure.steps.map((s) => {
    const status = stepStatus.get(s.step_number);
    const cls = status ? ` ${status}` : '';
    return `<div class="step-card${cls}"><strong>${s.step_number}. ${s.title}</strong>
      <span>${s.target_component}</span></div>`;
  }).join('');
}

function selectedStep() {
  const n = Number($('stepSelect').value);
  return contract?.procedure.steps.find((s) => s.step_number === n);
}

function samplePayload(type) {
  const step = selectedStep();
  if (!step) return {};
  switch (type) {
    case 'STEP_STARTED':
      return { step_number: step.step_number, title: step.title, instruction: step.instruction, target_component: step.target_component };
    case 'STEP_COMPLETED':
      return { step_number: step.step_number, target_component: step.target_component };
    case 'ANNOTATION_CREATED':
      return { step_number: step.step_number, target_component: step.target_component, marker_type: 'highlight', space: 'view_aligned', label: step.instruction };
    case 'SESSION_ENDED':
      return { reason: 'procedure_complete' };
    default:
      return {};
  }
}

// Apply an incoming (or replayed) event to local UI state. Idempotent by eventId.
function applyEvent(env) {
  if (env.eventId && seenEventIds.has(env.eventId)) return; // already applied — snapshot replay guard
  if (env.eventId) seenEventIds.add(env.eventId);

  const payload = env.payload || {};
  if (env.type === 'STEP_STARTED' && payload.step_number) stepStatus.set(payload.step_number, 'current');
  if (env.type === 'STEP_COMPLETED' && payload.step_number) stepStatus.set(payload.step_number, 'done');
  renderStepList();
}

function connect() {
  manualDisconnect = false;
  const url = $('url').value;
  setState(reconnectAttempts ? 'RECONNECTING' : 'CONNECTING');
  logLine(`Connecting to ${url} ...`);

  ws = new WebSocket(url);

  ws.onopen = () => {
    reconnectAttempts = 0;
    setState('CONNECTED');
    logLine('OPEN — sending JOIN');
    ws.send(JSON.stringify({ type: 'JOIN', sessionId: $('sessionId').value, role: $('role').value }));
    // Resend anything the server never ACKed before we dropped.
    for (const msg of pending.values()) {
      logLine(`RESEND ${JSON.stringify(msg)}`);
      ws.send(JSON.stringify(msg));
    }
  };

  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    logLine(`RECV ${evt.data}`);

    if (msg.type === 'PROJECT_CONTEXT') {
      contract = msg.payload;
      renderContract();
    } else if (msg.type === 'SNAPSHOT') {
      (msg.payload.events || []).forEach(applyEvent);
    } else if (msg.type === 'ACK') {
      if (msg.payload.eventId) pending.delete(msg.payload.eventId);
      updatePendingCount();
    } else if (['STEP_STARTED', 'STEP_COMPLETED', 'ANNOTATION_CREATED', 'SESSION_ENDED'].includes(msg.type)) {
      applyEvent(msg);
    }
  };

  ws.onclose = (evt) => {
    logLine(`CLOSE code=${evt.code} reason=${evt.reason}`);
    if (manualDisconnect) { setState('DISCONNECTED'); return; }
    setState('RECONNECTING');
    scheduleReconnect();
  };

  ws.onerror = (evt) => {
    logLine('ERROR (see console)');
    console.error(evt);
  };
}

function scheduleReconnect() {
  reconnectAttempts++;
  const delay = Math.min(1000 * 2 ** reconnectAttempts, 10000);
  logLine(`Reconnecting in ${delay}ms (attempt ${reconnectAttempts})`);
  reconnectTimer = setTimeout(connect, delay);
}

function disconnect() {
  manualDisconnect = true;
  clearTimeout(reconnectTimer);
  if (ws) ws.close(1000, 'manual disconnect');
  setState('DISCONNECTED');
}

$('connectBtn').onclick = connect;
$('disconnectBtn').onclick = disconnect;

document.querySelectorAll('button[data-type]').forEach((btn) => {
  btn.onclick = () => {
    const type = btn.getAttribute('data-type');
    const eventId = crypto.randomUUID();
    const msg = { type, eventId, payload: samplePayload(type) };
    pending.set(eventId, msg);
    updatePendingCount();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(msg));
      logLine(`SEND ${JSON.stringify(msg)}`);
    } else {
      logLine(`QUEUED (offline) ${JSON.stringify(msg)}`);
    }
  };
});
</script>
</body>
</html>
